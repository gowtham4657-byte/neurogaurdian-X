<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063a3a"/>
      <stop offset="1" stop-color="#0f8a84"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202b2d"/>
      <stop offset="1" stop-color="#0d1415"/>
    </linearGradient>
    <style>
      .title{font:800 34px Verdana,Arial,sans-serif;fill:#10201e}
      .sub{font:600 18px Verdana,Arial,sans-serif;fill:#40504e}
      .label{font:700 16px Verdana,Arial,sans-serif;fill:#10201e}
      .small{font:500 13px Verdana,Arial,sans-serif;fill:#42504e}
      .tiny{font:500 11px Verdana,Arial,sans-serif;fill:#42504e}
      .chip{fill:#ffffff;stroke:#10201e;stroke-width:2;rx:14}
      .sensor{fill:#e7f7ef;stroke:#087a75;stroke-width:2;rx:14}
      .critical{fill:#ffe8e8;stroke:#d74b4b;stroke-width:2;rx:14}
      .power{fill:#fff4dc;stroke:#d89a21;stroke-width:2;rx:14}
      .wire{fill:none;stroke:#52605e;stroke-width:2;stroke-dasharray:6 6}
      .i2c{fill:none;stroke:#007c7a;stroke-width:3}
      .analog{fill:none;stroke:#d89a21;stroke-width:3}
      .ble{fill:none;stroke:#2e74b5;stroke-width:3}
      .note{fill:#f7fbf8;stroke:#d9e8e2;stroke-width:2;rx:18}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f3f8f5"/>
  <text x="60" y="60" class="title">NeuroGuardian X Wrist Watch Sensor Layout</text>
  <text x="60" y="92" class="sub">Prototype layout for fall + no-movement SOS with GPS, vitals, and ESP32 BLE app connection</text>

  <!-- Strap and watch body -->
  <rect x="610" y="105" width="180" height="690" rx="70" fill="url(#strapGrad)"/>
  <rect x="445" y="210" width="510" height="455" rx="80" fill="url(#caseGrad)" stroke="#071c1c" stroke-width="8"/>
  <rect x="500" y="265" width="400" height="250" rx="42" fill="#081918" stroke="#9fe0d3" stroke-width="3"/>
  <text x="560" y="330" fill="#ffffff" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="800">NeuroGuardian X</text>
  <text x="585" y="370" fill="#b7fff1" font-family="Verdana,Arial,sans-serif" font-size="18" font-weight="700">Live Vitals + Fall SOS</text>
  <circle cx="560" cy="440" r="32" fill="#d74b4b"/>
  <text x="615" y="447" fill="#ffffff" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="800">SOS READY</text>

  <!-- Top electronics board inside case -->
  <rect x="520" y="540" width="360" height="82" rx="22" fill="#ffffff" opacity="0.96"/>
  <text x="555" y="575" class="label">Top PCB: ESP32-C3 + power + BLE antenna</text>
  <text x="555" y="602" class="small">Keep antenna at top edge, away from battery/copper</text>

  <!-- Back view -->
  <rect x="90" y="190" width="290" height="380" rx="62" fill="#152123" stroke="#071c1c" stroke-width="7"/>
  <text x="115" y="170" class="label">Back / skin side</text>
  <circle cx="235" cy="310" r="72" fill="#091313" stroke="#0aa39a" stroke-width="5"/>
  <circle cx="205" cy="302" r="12" fill="#d74b4b"/>
  <circle cx="265" cy="302" r="12" fill="#7cc8ff"/>
  <circle cx="235" cy="338" r="18" fill="#2b3234" stroke="#ffffff" stroke-width="2"/>
  <text x="142" y="415" fill="#ffffff" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="700">MAX30102 optical window</text>
  <text x="132" y="440" fill="#d8fffa" font-family="Verdana,Arial,sans-serif" font-size="13">Heart rate + SpO2 must touch skin</text>
  <rect x="120" y="470" width="230" height="54" rx="18" fill="#fff4dc" stroke="#d89a21" stroke-width="2"/>
  <text x="142" y="502" class="label">MAX30205 temp pad</text>
  <circle cx="118" cy="238" r="22" fill="#f4d06f" stroke="#3d2a00" stroke-width="2"/>
  <circle cx="352" cy="238" r="22" fill="#f4d06f" stroke="#3d2a00" stroke-width="2"/>
  <text x="113" y="592" class="small">Gold contacts: GSR + ECG reference</text>

  <!-- Strap electrodes -->
  <rect x="1010" y="125" width="230" height="650" rx="76" fill="url(#strapGrad)"/>
  <text x="1018" y="100" class="label">Strap / electrode layout</text>
  <rect x="1055" y="220" width="140" height="64" rx="28" fill="#f4d06f" stroke="#3d2a00" stroke-width="3"/>
  <text x="1078" y="257" class="label">GSR pad 1</text>
  <rect x="1055" y="342" width="140" height="64" rx="28" fill="#f4d06f" stroke="#3d2a00" stroke-width="3"/>
  <text x="1078" y="379" class="label">GSR pad 2</text>
  <rect x="1055" y="502" width="140" height="74" rx="30" fill="#ffe8e8" stroke="#d74b4b" stroke-width="3"/>
  <text x="1086" y="536" class="label">ECG</text>
  <text x="1078" y="558" class="tiny">finger touch</text>
  <text x="1018" y="815" class="small">ECG needs second contact: user touches side/top metal pad</text>

  <!-- Component blocks -->
  <rect x="430" y="725" width="170" height="70" class="chip"/>
  <text x="455" y="755" class="label">ESP32-C3</text>
  <text x="452" y="778" class="small">BLE to phone app</text>

  <rect x="620" y="725" width="180" height="70" class="power"/>
  <text x="646" y="755" class="label">LiPo + charger</text>
  <text x="646" y="778" class="small">MCP73831 / TP4056</text>

  <rect x="820" y="725" width="170" height="70" class="critical"/>
  <text x="844" y="755" class="label">Watch GPS</text>
  <text x="842" y="778" class="small">patient location</text>

  <rect x="430" y="115" width="175" height="68" class="sensor"/>
  <text x="454" y="145" class="label">BMI270 / MPU6050</text>
  <text x="462" y="168" class="small">fall + movement</text>

  <rect x="620" y="115" width="175" height="68" class="sensor"/>
  <text x="655" y="145" class="label">MAX30102</text>
  <text x="642" y="168" class="small">HR + SpO2 optical</text>

  <rect x="810" y="115" width="175" height="68" class="sensor"/>
  <text x="845" y="145" class="label">MAX30205</text>
  <text x="842" y="168" class="small">body temperature</text>

  <rect x="1030" y="610" width="190" height="68" class="sensor"/>
  <text x="1075" y="640" class="label">GSR circuit</text>
  <text x="1058" y="663" class="small">skin conductance</text>

  <rect x="1030" y="705" width="190" height="68" class="critical"/>
  <text x="1070" y="735" class="label">AD8232 ECG</text>
  <text x="1050" y="758" class="small">single-lead front-end</text>

  <!-- Wires -->
  <path d="M518 183 C540 225, 560 245, 610 285" class="i2c"/>
  <path d="M708 183 C708 220, 708 235, 708 265" class="i2c"/>
  <path d="M895 183 C860 220, 840 245, 800 285" class="i2c"/>
  <path d="M515 725 C565 665, 610 635, 650 620" class="ble"/>
  <path d="M800 725 C810 665, 850 640, 880 600" class="wire"/>
  <path d="M1125 610 C1025 550, 965 500, 900 455" class="analog"/>
  <path d="M1125 705 C1020 655, 980 590, 900 505" class="analog"/>

  <!-- Notes -->
  <rect x="60" y="675" width="320" height="165" class="note"/>
  <text x="85" y="710" class="label">Placement rules</text>
  <text x="85" y="740" class="small">1. Optical HR/SpO2 on back, tight to skin.</text>
  <text x="85" y="765" class="small">2. IMU near watch center for fall detection.</text>
  <text x="85" y="790" class="small">3. GSR/ECG need gold skin/finger contacts.</text>
  <text x="85" y="815" class="small">4. BLE antenna away from battery and ground pour.</text>

  <rect x="1010" y="20" width="330" height="78" class="note"/>
  <text x="1034" y="50" class="label">SOS flow</text>
  <text x="1034" y="75" class="small">Fall detected -> 30s no movement -> app sends watch GPS SOS</text>

  <!-- Legend -->
  <rect x="430" y="830" width="560" height="42" class="note"/>
  <line x1="455" y1="852" x2="500" y2="852" class="i2c"/><text x="510" y="858" class="small">I2C</text>
  <line x1="570" y1="852" x2="615" y2="852" class="analog"/><text x="625" y="858" class="small">Analog</text>
  <line x1="715" y1="852" x2="760" y2="852" class="ble"/><text x="770" y="858" class="small">BLE / GPS link</text>
</svg>
